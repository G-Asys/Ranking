<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ranking Colocación</title>
</head>
<body>
<title>Ranking Colocación</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra fija (sponsor → año → mes → supervisor → oficina → buscar) → KPIs → tarjetas de oficina o tabla de una oficina.
   Acento por sponsor; medallas oro/plata/bronce para el top 3. */
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f7f9fc; --surface-3:#eef2f7;
  --fg:#172031; --muted:#5c6779; --faint:#8a94a4; --border:#e0e6ef; --border-strong:#cdd6e2;
  --accent-bcr:#1763a6; --accent-bncr:#0e7c6b; --accent-coopenae:#6d4ac0; --accent-coopeande:#2f8f3e; --accent-bp:#c0442e;
  --soft-bncr:#e1f3ee; --soft-bcr:#e7f0f9; --soft-coopenae:#efe9fb; --soft-coopeande:#e6f4e9; --soft-bp:#fdeae6;
  --accent:#0e7c6b; --accent-soft:var(--soft-bncr);
  --gold:#c99700; --silver:#7f8a9b; --bronze:#b26a35;
  --good:#1f9d6b; --warn:#b8791b; --warn-bg:#fdf3e2;
  --shadow:0 1px 2px rgba(23,32,49,.06), 0 4px 16px rgba(23,32,49,.05);
  --r:14px;
  --f-display:'Archivo', system-ui, sans-serif;
  --f-body:'IBM Plex Sans', system-ui, sans-serif;
}
body[data-sponsor="bcr"]{--accent:var(--accent-bcr); --accent-soft:var(--soft-bcr);}
body[data-sponsor="bncr"]{--accent:var(--accent-bncr); --accent-soft:var(--soft-bncr);}
body[data-sponsor="coopenae"]{--accent:var(--accent-coopenae); --accent-soft:var(--soft-coopenae);}
body[data-sponsor="coopeande"]{--accent:var(--accent-coopeande); --accent-soft:var(--soft-coopeande);}
body[data-sponsor="bp"]{--accent:var(--accent-bp); --accent-soft:var(--soft-bp);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e131b; --surface:#161d28; --surface-2:#1a2230; --surface-3:#222b3b;
  --fg:#e8edf4; --muted:#9ba7b8; --faint:#6b7585; --border:#28313f; --border-strong:#36414f;
  --accent-bcr:#4a9be0; --accent-bncr:#36c3a8; --accent-coopenae:#a68bf0; --accent-coopeande:#52c266; --accent-bp:#e0765c;
  --soft-bncr:#102a24; --soft-bcr:#132536; --soft-coopenae:#1e1733; --soft-coopeande:#11261a; --soft-bp:#2a1812;
  --accent:#36c3a8; --accent-soft:var(--soft-bncr);
  --gold:#e3b43a; --silver:#9aa6b7; --bronze:#cf8a56;
  --good:#3fc08c; --warn:#d99f42; --warn-bg:#2a2214;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e131b; --surface:#161d28; --surface-2:#1a2230; --surface-3:#222b3b;
  --fg:#e8edf4; --muted:#9ba7b8; --faint:#6b7585; --border:#28313f; --border-strong:#36414f;
  --accent-bcr:#4a9be0; --accent-bncr:#36c3a8; --accent-coopenae:#a68bf0; --accent-coopeande:#52c266; --accent-bp:#e0765c;
  --soft-bncr:#102a24; --soft-bcr:#132536; --soft-coopenae:#1e1733; --soft-coopeande:#11261a; --soft-bp:#2a1812;
  --accent:#36c3a8; --accent-soft:var(--soft-bncr);
  --gold:#e3b43a; --silver:#9aa6b7; --bronze:#cf8a56;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg); color:var(--fg); font-family:var(--f-body); line-height:1.45; margin:0; -webkit-font-smoothing:antialiased;}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--surface);}
h1,h2,h3{font-family:var(--f-display); margin:0; text-wrap:balance; letter-spacing:-.01em;}
.tnum{font-variant-numeric:tabular-nums;}

.bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--surface); border-bottom:1px solid var(--border);}
.bar-in{max-width:1120px; margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:11px; display:flex; flex-direction:column; gap:11px;}
.brand{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
.brand h1{font-size:18px; font-weight:800;}
.brand .corte{font-size:11.5px; color:var(--muted); margin-left:auto; text-align:right; line-height:1.3;}
.brand .corte b{color:var(--fg); font-weight:600;}
.sponsors{display:flex; gap:6px; flex-wrap:wrap;}
.sp-btn{font-family:var(--f-display); font-weight:600; font-size:12.5px; padding:6px 13px; border-radius:999px;
  border:1px solid var(--border-strong); background:var(--surface-2); color:var(--muted); cursor:pointer; transition:all .15s; white-space:nowrap;}
.sp-btn:hover{color:var(--fg); border-color:var(--accent);}
.sp-btn.active{background:var(--accent); color:#fff; border-color:var(--accent);}
.sp-btn.soon{opacity:.45; cursor:not-allowed;}
.sp-btn.soon:hover{color:var(--muted); border-color:var(--border-strong);}

.controls{display:flex; gap:9px; align-items:flex-end; flex-wrap:wrap;}
.field{display:flex; flex-direction:column; gap:3px; min-width:0;}
.field label{font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:700; padding-left:2px;}
select, .search input{font-family:var(--f-body); font-size:13px; color:var(--fg); background:var(--surface-2);
  border:1px solid var(--border-strong); border-radius:9px; padding:7px 10px; min-width:0; max-width:100%;}
select{cursor:pointer;}
#f-year{min-width:78px} #f-month{min-width:118px} #f-sup{min-width:170px} #f-office{min-width:210px}
.search{flex:1 1 150px; min-width:0;}
.search input{width:100%;}
.search input::placeholder{color:var(--faint);}
.toggle{display:inline-flex; border:1px solid var(--border-strong); border-radius:9px; overflow:hidden; background:var(--surface-2);}
.toggle button{font-family:var(--f-body); font-weight:600; font-size:12.5px; padding:7px 12px; border:0; background:transparent; color:var(--muted); cursor:pointer;}
.toggle button.active{background:var(--accent); color:#fff;}

.wrap{max-width:1120px; margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:18px 48px;}
.scopeline{font-size:12.5px; color:var(--muted); margin:2px 2px 14px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.scopeline .chip{background:var(--accent-soft); color:var(--accent); font-weight:600; border-radius:999px; padding:3px 11px; font-size:12px;}
.scopeline .chip-cut{background:var(--accent); color:#fff;}

.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(148px,1fr)); gap:11px; margin-bottom:6px;}
.kpi{background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:13px 15px; box-shadow:var(--shadow);}
.kpi .lbl{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600;}
.kpi .val{font-family:var(--f-display); font-weight:800; font-size:23px; margin-top:4px; letter-spacing:-.02em;}
.kpi .sub{font-size:11px; color:var(--faint); margin-top:2px;}

details.rules{margin:13px 0 4px; background:var(--surface); border:1px solid var(--border); border-radius:var(--r); box-shadow:var(--shadow);}
details.rules>summary{cursor:pointer; list-style:none; padding:11px 15px; font-family:var(--f-display); font-weight:600; font-size:13px; color:var(--fg); display:flex; align-items:center; gap:8px;}
details.rules>summary::-webkit-details-marker{display:none}
details.rules>summary::before{content:"ⓘ"; color:var(--accent); font-size:15px;}
details.rules>summary::after{content:"▾"; margin-left:auto; color:var(--muted); transition:transform .2s;}
details.rules[open]>summary::after{transform:rotate(180deg);}
.rules-body{padding:0 15px 15px; font-size:12.5px; color:var(--muted); line-height:1.65;}
.rules-body b{color:var(--fg);}
.rules-body code{background:var(--surface-3); padding:1px 6px; border-radius:5px; font-size:11.5px;}
.pct-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:5px 16px; margin-top:8px;}
.pct-grid span{display:flex; justify-content:space-between; border-bottom:1px dotted var(--border); padding:3px 0;}
.pct-grid span b{color:var(--accent);}
.note{display:flex; gap:9px; align-items:flex-start; background:var(--warn-bg); border:1px solid var(--warn); border-radius:10px; padding:9px 12px; font-size:12px; color:var(--warn); margin:11px 0;}

.section-head{display:flex; align-items:baseline; gap:10px; margin:20px 2px 11px; flex-wrap:wrap;}
.section-head h2{font-size:15px; font-weight:700;}
.section-head .count{font-size:12px; color:var(--muted);}

.office{background:var(--surface); border:1px solid var(--border); border-radius:var(--r); box-shadow:var(--shadow); margin-bottom:11px; overflow:hidden;}
.office>summary{cursor:pointer; list-style:none; padding:12px 15px; display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:13px;}
.office>summary::-webkit-details-marker{display:none}
.office>summary:hover{background:var(--surface-2);}
.rank{width:33px; height:33px; border-radius:9px; display:grid; place-items:center; font-family:var(--f-display); font-weight:800; font-size:13.5px; background:var(--surface-3); color:var(--muted); flex:none;}
.rank.r1{background:var(--gold); color:#2a2000;} .rank.r2{background:var(--silver); color:#1a1f28;} .rank.r3{background:var(--bronze); color:#2a1405;}
.office .name{font-family:var(--f-display); font-weight:700; font-size:14px; min-width:0;}
.office .name small{display:block; font-family:var(--f-body); font-weight:500; font-size:11px; color:var(--faint); letter-spacing:.02em;}
.office .stats{display:flex; gap:17px; text-align:right;}
.office .stats .s{display:flex; flex-direction:column;}
.office .stats .s .n{font-family:var(--f-display); font-weight:700; font-size:14.5px;}
.office .stats .s .k{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--faint);}
.office>summary::after{content:"▾"; color:var(--muted); font-size:13px; transition:transform .2s;}
.office[open]>summary::after{transform:rotate(180deg);}

.solo{background:var(--surface); border:1px solid var(--border); border-radius:var(--r); box-shadow:var(--shadow); overflow:hidden; margin-bottom:11px;}
.solo .solohead{padding:14px 16px; display:flex; align-items:center; gap:13px; border-bottom:1px solid var(--border); flex-wrap:wrap;}
.solo .solohead .name{font-family:var(--f-display); font-weight:800; font-size:17px;}
.solo .solohead .stats{display:flex; gap:20px; margin-left:auto; text-align:right;}
.solo .solohead .stats .s .n{font-family:var(--f-display); font-weight:700; font-size:16px;}
.solo .solohead .stats .s .k{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--faint);}

.tscroll{overflow-x:auto;}
table{width:100%; border-collapse:collapse; font-size:13px; min-width:460px;}
thead th{text-align:center; font-weight:600; font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--faint); padding:8px 12px; background:var(--surface-2); border-bottom:1px solid var(--border); white-space:normal; line-height:1.25; vertical-align:bottom;}
thead th:first-child, tbody td:first-child{text-align:center;}
thead th.l, tbody td.l{text-align:left;}
tbody td{padding:9px 12px; border-bottom:1px solid var(--border); text-align:center; white-space:nowrap;}
tbody tr:last-child td{border-bottom:0;}
tbody tr:hover{background:var(--surface-2);}
tbody tr.hit{background:var(--accent-soft);}
.vn{font-weight:600; color:var(--fg);}
.badge-an{display:inline-block; margin-left:7px; font-size:10px; font-weight:700; letter-spacing:.02em; color:var(--warn);
  background:var(--warn-bg); border:1px solid var(--warn-bg); border-radius:999px; padding:1px 7px; vertical-align:middle; cursor:help;}
.costo-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:5px 16px; margin-top:8px;}
.costo-grid span{display:flex; justify-content:space-between; border-bottom:1px dotted var(--border); padding:3px 0;}
.costo-grid span b{color:var(--accent); font-variant-numeric:tabular-nums;}
.mini-rank{display:inline-grid; place-items:center; width:24px; height:24px; border-radius:7px; font-family:var(--f-display); font-weight:700; font-size:11px; background:var(--surface-3); color:var(--muted);}
.mini-rank.r1{background:var(--gold); color:#2a2000;} .mini-rank.r2{background:var(--silver); color:#1a1f28;} .mini-rank.r3{background:var(--bronze); color:#2a1405;}
td .money{color:var(--fg); font-weight:600;} td .com{color:var(--good); font-weight:600;} td .ap{color:var(--accent); font-weight:600;}
.office-cell{color:var(--muted); font-size:12px;}
tfoot td{padding:9px 12px; font-weight:700; background:var(--surface-2); border-top:1px solid var(--border-strong); text-align:center; font-size:12px;}
tfoot td.l{text-align:left; text-transform:uppercase; letter-spacing:.04em; font-size:10px; color:var(--muted);}

.empty{text-align:center; padding:48px 20px; color:var(--faint);}
.empty .big{font-family:var(--f-display); font-size:16px; color:var(--muted); margin-bottom:4px;}
footer{max-width:1120px; margin:0 auto; padding:22px 16px 8px; color:var(--faint); font-size:11px; text-align:center;}

.actions{display:flex; align-items:center; gap:8px; margin-left:auto; flex-wrap:wrap;}
.imp-btn,.dl-btn{font-family:var(--f-body); font-weight:600; font-size:12px; padding:7px 12px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; white-space:nowrap;}
.dl-btn{background:transparent; color:var(--accent);}
.imp-btn.alt{background:transparent; color:var(--accent);}
.imp-btn:hover,.dl-btn:hover{filter:brightness(1.08);}
.tc-wrap{font-size:12px; color:var(--muted); display:inline-flex; align-items:center; gap:3px; border:1px solid var(--border-strong); border-radius:8px; padding:3px 8px; background:var(--surface-2);}
.tc-wrap input{width:60px; border:0; background:transparent; color:var(--fg); font-family:var(--f-body); font-size:13px;}
.imgbtn{font-family:var(--f-body); font-size:10.5px; font-weight:600; color:var(--accent); background:var(--accent-soft); border:1px solid var(--border-strong); border-radius:7px; padding:3px 8px; cursor:pointer; margin-left:8px; flex:none;}
.imgbtn:hover{background:var(--accent); color:#fff;}
table.grid{min-width:380px;}
table.grid td.gcell{text-align:center; font-weight:700;}
table.grid td.gcell.gok{background:#1f9d6b; color:#fff;}
table.grid td.gcell.gno{background:#d7452f; color:#fff;}
.glegend{display:flex; gap:18px; padding:10px 14px; font-size:11.5px; color:var(--muted); border-top:1px solid var(--border); flex-wrap:wrap;}
.glegend i{display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:middle; margin-right:5px;}
.glegend i.gok{background:#1f9d6b;} .glegend i.gno{background:#d7452f;}
#overlay{position:fixed; inset:0; z-index:50; background:rgba(10,15,25,.55); display:flex; align-items:center; justify-content:center; padding:20px;}
#overlay .ov-box{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:26px 34px; box-shadow:var(--shadow); text-align:center; color:var(--fg); font-family:var(--f-display); font-weight:600;}
#overlay .spinner{width:34px; height:34px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; margin:0 auto 14px; animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#overlay .ov-msg{font-size:14px;}
#toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); background:var(--fg); color:var(--bg); padding:11px 18px; border-radius:10px; font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition:all .25s; z-index:60; max-width:90%; text-align:center;}
#toast.on{opacity:1; transform:translateX(-50%) translateY(0);}
.sin-head{margin:24px 2px 10px; font-family:var(--f-display); font-weight:700; font-size:13.5px; color:var(--muted); display:flex; align-items:center; gap:8px;}
.sin-head::before{content:""; height:1px; flex:none; width:16px; background:var(--border-strong);}
.office.noact{opacity:1;}
.office.noact .name small{color:var(--fg); font-weight:600; font-size:11.5px;}
.office.noact .name small b.lastreg{color:var(--warn); font-weight:700;}
.office.noact>summary{cursor:default; grid-template-columns:auto 1fr auto;}
.office.noact>summary:hover{background:none;}
.office.noact>summary::after{display:none;}
.noact-tag{font-family:var(--f-body); font-weight:600; font-size:11px; color:var(--warn); background:var(--warn-bg); border:1px solid var(--warn); border-radius:999px; padding:3px 11px; white-space:nowrap;}
@media (max-width:620px){
  .office>summary{grid-template-columns:auto 1fr; gap:10px;}
  .actions{width:100%; margin-left:0;}
  .office .stats{grid-column:1 / -1; justify-content:flex-start; gap:22px; padding-left:44px;}
  .office>summary::after{display:none;}
  .brand .corte{margin-left:0; width:100%; text-align:left;}
  .solo .solohead .stats{margin-left:0; width:100%;}
}
</style>

<div class="bar">
  <div class="bar-in">
    <div class="brand">
      <h1 id="title">Ranking de Colocación</h1>
      <div class="actions">
        <label class="imp-btn" title="Importar CSV de la hoja Ventas, o el Excel">⬆ Importar datos<input id="f-import" type="file" accept=".csv,.xlsx,.xls" hidden></label>
        <label class="imp-btn alt" title="Importar o actualizar tu catálogo de oficinas por sponsor">⬆ Oficinas<input id="f-offices" type="file" accept=".csv,.xlsx,.xls" hidden></label>
        <label class="tc-wrap" title="Tipo de cambio para colonizar dólares">TC ₡<input id="f-tc" type="number" value="510" min="1" step="0.01"></label>
        <div class="corte"><span id="corte-tc"></span><br><span id="corte-sub"></span></div>
      </div>
    </div>
    <div class="sponsors" id="sponsors"></div>
    <div class="controls">
      <div class="field"><label>Año</label><select id="f-year"></select></div>
      <div class="field" id="month-field"><label>Mes</label><select id="f-month"></select></div>
      <div class="field"><label>Supervisor</label><select id="f-sup"></select></div>
      <div class="field"><label>Oficina</label><select id="f-office"></select></div>
      <div class="field"><label>Vista</label>
        <div class="toggle" id="view">
          <button data-v="office" class="active">Oficinas</button>
          <button data-v="flat">Vendedores</button>
        </div>
      </div>
      <div class="field search"><label>Buscar vendedor</label><input id="search" type="text" placeholder="Nombre…" autocomplete="off"></div>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="scopeline" id="scope"></div>
  <div class="kpis" id="kpis"></div>
  <div id="rules"></div>
  <div id="content"></div>
</div>
<footer id="foot">Tablero de rankings de colocación · colones (CRC). Importá el CSV de la hoja “Ventas 2025-2026” para actualizar; los datos se guardan automáticamente en este navegador.</footer>

/* Parsea F EMISIÓN (M/D/AAAA, AAAA-MM-DD o serial Excel) -> {key:'AAAAMMDD', iso:'AAAA-MM-DD'} */
function parseDate(v){

    if(pm&&hh<12)hh+=12; if(!pm&&hh===12)hh=0; }

  hh:tm?tm.hh:null, mi:tm?tm.mi:null, hasTime:!!tm}; }

function buildMatchers(directory){
  var M={};
  for(var sp in (directory||{})){
    var byNum={},byName={},list=directory[sp]||[];
    for(var i=0;i<list.length;i++){var nm=String(list[i]).trim(); if(!nm)continue;

}

function process(rows, rate, directory){

  var M=buildMatchers(directory||{});
  var hdr=rows[0], I={}; for(var c=0;c<hdr.length;c++) I[String(hdr[c]).trim()]=c;
  var SP=I['SPONSOR'],PR=I['Prima'],PRD=I['PRIMA $'],SUC=I['SUCURSAL HOMOLOGADA'],VEN=I['VENDEDOR'],
      MES=I['MES'],ANIO=I['AÑO'],PFIN=I['PRODUCTO FINAL'],SUP=I['SUPERVISOR'],TP=I['TIPO PRIMA'],SEM=I['SEMANA'],FE=I['F EMISIÓN'],HO=I['HORA'];

  /* officeId: 'D'+nombreCatálogo si calza; si no, 'K'+clave (número o nombre). */

    var dt=parseDate(r[FE]), yv=toNum(r[ANIO]);

      var co=cutObj(dt, HO!=null?parseTime(r[HO]):null);

      out=best||oid.slice(1);

  }

  /* ---- Pass 2: agregación por oficina-hogar ---- */
  var bncr={},bcr={},coop={},ande={},bp={},purdy={};
  var bncrNotes={}, coopUnk={}, bpUnk={}, bcrLastMonth={}, bcrMonths={}, lastOff={};
  function note(pk){ if(!bncrNotes[pk])bncrNotes[pk]={usd_pol:0,usd_monto:0,sinpct:{},sinpct_total:0,rdh_anual:0}; return bncrNotes[pk]; }
  function addUnk(map,pk,pf){ if(!map[pk])map[pk]={}; map[pk][pf]=(map[pk][pf]||0)+1; }
  function cellOf(store,key){ if(!store[key])store[key]={}; return store[key]; }

  for(var ri3=1;ri3<rows.length;ri3++){

    var sup=sname(r[SUP]), m=String(r[MES]).toLowerCase(), pf=String(r[PFIN]), sem=r[SEM];
    var ven=vname(r[VEN]); var office=dispName(spk, officeId(spk, String(r[SUC])));

    var mi2=MESES.indexOf(m);

      vv._m[m]=(vv._m[m]||0)+1;

      if(pct===null){ nt.sinpct[pf]=(nt.sinpct[pf]||0)+1; nt.sinpct_total++; pct=0; }

      var fam=puf.indexOf('RDH')===0?'RDH':(puf.indexOf('PROTEC')===0?'PROT':null);

      var info=COOP_PROD[pf], rateP, mn; if(info){rateP=info[0];mn=info[1];}else{rateP=0;mn=false;addUnk(coopUnk,y+'|'+m,pf);}
      var wk=vv2.w[sem]||(vv2.w[sem]={c:0,main:0,amt:0}); wk.c++; wk.amt+=rateP; if(mn)wk.main++;
    } else if(spk==='coopeande'){

      vd._v[ven]=(vd._v[ven]||0)+1;
    } else if(spk==='bp'){
      var ofp=cellOf(bp,y+'|'+m+'|'+sup); var vp=ofp[office]||(ofp[office]={_v:{}});
      var vv4=vp._v[ven]||(vp._v[ven]={pol:0,base:0,fijoN:0,muv:0,tiq:0,unk:0}); vv4.pol++;
      var cat=BP_MAP[pf];

    var years=Object.keys(ys).sort();

    if(ym){var mb={},sp2={};for(var yy in mby)mb[yy]=sm(mby[yy]);for(var k in sbp)sp2[k]=Object.keys(sbp[k]).sort();
      return {years:years,monthsByYear:mb,supsByPeriod:sp2};}

    return {years:years,supsByYear:sb};
  }
  function sortD(a,f){a.sort(function(x,y){return (y[f]||0)-(x[f]||0);});}
  function sumF(a,f){var t=0;for(var i=0;i<a.length;i++)t+=(a[i][f]||0);return t;}

  // BNCR

    for(var office in cell){var vs=[],V=cell[office]._v;
      for(var ven in V){var d=V[ven],co=comBNCR(d.prmBase)+d.tiq*TIQ;

    sortD(ol,'total'); bcrCells[key]=ol;}
  // COOPENAE
  var coopCells={},weeksByPeriod={};
  for(var key in coop){var pa=key.split('|'),pk=pa[0]+'|'+pa[1],cell=coop[key],ol=[];
    for(var office in cell){var vs=[],owk={},V=cell[office]._v;
      for(var ven in V){var d=V[ven],com=0,semok=0,semtot=0,wout={};
        for(var sem in d.w){var w=d.w[sem],c=w.c;semtot++;wout[sem]=c;owk[sem]=(owk[sem]||0)+c;if(c>=2){com+=w.amt;semok++;}}
        vs.push({v:ven,pol:d.pol,com:r2(com),semok:semok,semtot:semtot,w:wout});
        (weeksByPeriod[pk]=weeksByPeriod[pk]||{}); for(var s in wout)weeksByPeriod[pk][s]=1;}
      sortD(vs,'com');
      ol.push({o:office,pol:sumF(vs,'pol'),com:r2(sumF(vs,'com')),w:owk,vs:vs});}
    sortD(ol,'com'); coopCells[key]=ol;}

    sortD(ol,'com'); andeCells[key]=ol;}
  // BP

  for(var key in bp){var cell=bp[key],ol=[];
    for(var office in cell){var vs=[],V=cell[office]._v;
      for(var ven in V){var d=V[ven],ce=d.base*bpEsc(d.base),cf=d.fijoN*bpFijo(d.fijoN),cm=d.muv,ct=d.tiq*TIQ;
        vs.push({v:ven,pol:d.pol,base:r2(d.base),ce:r2(ce),cf:r2(cf),cm:r2(cm),ct:r2(ct),co:r2(ce+cf+cm+ct),unk:d.unk});}
      sortD(vs,'co'); ol.push({o:office,pol:sumF(vs,'pol'),base:r2(sumF(vs,'base')),co:r2(sumF(vs,'co')),unk:sumF(vs,'unk'),vs:vs});}
    sortD(ol,'co'); bpCells[key]=ol;}
  // PURDY
  var purdyCells={};
  for(var key in purdy){var cell=purdy[key],ol=[];
    for(var office in cell){var vs=[],V=cell[office]._v;
      for(var ven in V){var pol=V[ven];vs.push({v:ven,pol:pol,rate:purdyRate(pol),bono:purdyBono(pol),com:purdyCalc(pol)});}
      sortD(vs,'com'); ol.push({o:office,pol:sumF(vs,'pol'),com:sumF(vs,'com'),vs:vs});}
    sortD(ol,'com'); purdyCells[key]=ol;}

  function lmMap(o){var r={};for(var y in o)r[y]=MESES[o[y]];return r;}
  function bcrMonthsMap(){var r={};for(var y in bcrMonths)r[y]=MESES.filter(function(x){return bcrMonths[y][x];});return r;}
  function asg(a,b){for(var k in b)a[k]=b[k];return a;}
  function cclean(c){return {iso:c.iso,hh:c.hh,mi:c.mi,hasTime:c.hasTime};}
  var mdP={}; for(var kk in maxP)mdP[kk]=cclean(maxP[kk]);
  var mdY={}; for(var yy in maxY)mdY[yy]=cclean(maxY[yy]);
  return {
    schema:6,
    rate:rate, pct:PCT_LABELS, generated:new Date().toISOString().slice(0,10), directory:directory||{},
    maxDate:maxG?cclean(maxG):null, maxDateByPeriod:mdP, maxDateByYear:mdY,
    bncr:asg(dims(bncrCells,true),{cells:bncrCells,notes:bncrNotes,lastByOfficeYear:lastOff.bncr||{}}),
    bcr:asg(dims(bcrCells,false),{cells:bcrCells,lastMonthByYear:lmMap(bcrLastMonth),monthsByYear:bcrMonthsMap(),lastByOfficeYear:lastOff.bcr||{}}),
    coopenae:asg(dims(coopCells,true),{cells:coopCells,weeksByPeriod:wbp,unk:coopUnk,lastByOfficeYear:lastOff.coopenae||{}}),
    coopeande:asg(dims(andeCells,true),{cells:andeCells,lastByOfficeYear:lastOff.coopeande||{}}),
    bp:asg(dims(bpCells,true),{cells:bpCells,unk:bpUnk,lastByOfficeYear:lastOff.bp||{}}),
    purdy:asg(dims(purdyCells,true),{cells:purdyCells,lastByOfficeYear:lastOff.purdy||{}}),
  };
}

/* Construye el directorio desde el Excel/CSV de oficinas (filas = [oficina, ...columnas sponsor]) */
function buildDirectory(rows){
  var dir={}; if(!rows||!rows.length)return dir;
  var hdr=rows[0], cols=[];
  for(var c=1;c<hdr.length;c++){var key=DIRCOL[String(hdr[c]).toUpperCase().trim()]; cols.push(key||null);}
  for(var ri=1;ri<rows.length;ri++){var r=rows[ri]; if(!r)continue; var name=r[0]; if(name==null||String(name).trim()==='')continue;
    for(var ci=1;ci<r.length;ci++){ if(r[ci]!=null&&String(r[ci]).trim()!==''){ var k=cols[ci-1]; if(k){ (dir[k]=dir[k]||[]).push(String(name).trim()); } } }}
  // aplicar alias y de-duplicar (dos nombres de catálogo que son la misma oficina -> uno)
  for(var sp in dir){ var seen={}, arr=[]; dir[sp].forEach(function(nm){ var c=aliasName(sp,nm); var kk=normName(c); if(!seen[kk]){seen[kk]=1;arr.push(c);} }); dir[sp]=arr; }
  return dir;
}

/* Normaliza un directorio YA construido: aplica alias y de-duplica (para catálogos
   guardados antes de existir el alias). */
function aliasDirectory(dir){ var out={}; if(!dir)return out;
  for(var sp in dir){ var seen={},arr=[]; (dir[sp]||[]).forEach(function(nm){ var c=aliasName(sp,nm); var k=normName(c); if(!seen[k]){seen[k]=1;arr.push(c);} }); out[sp]=arr; }
  return out; }
root.RankProcessor={process:process, buildDirectory:buildDirectory, aliasDirectory:aliasDirectory, MESES:MESES, DIRCOL:DIRCOL};
})(typeof window!=='undefined'?window:(typeof module!=='undefined'?module.exports:this));

/* ---------- Scope + merge ---------- */
function cellKeys(){var sups=state.sup===ALL?supsAvailable():[state.sup];
  return sch().period==='month'?sups.map(function(s){return state.year+'|'+state.month+'|'+s;}):sups.map(function(s){return state.year+'|'+s;});}
function scopeOffices(){var cells=D().cells,lists=cellKeys().map(function(key){return cells[key];}).filter(Boolean);
  if(lists.length===0)return [];if(lists.length===1)return lists[0];return mergeCells(lists);}
function mergeCells(lists){var s=sch(),byO={};
  lists.forEach(function(l){l.forEach(function(o){var a=byO[o.o];if(!a){a={o:o.o,_v:{},_w:{}};byO[o.o]=a;}
    o.vs.forEach(function(v){var x=a._v[v.v];if(!x){x={v:v.v};s.vsum.forEach(function(f){x[f]=0;});if(s.wfield)x._w={};a._v[v.v]=x;}
      s.vsum.forEach(function(f){x[f]=round2((x[f]||0)+(v[f]||0));});
      if(s.wfield){var w=v[s.wfield]||{};for(var k in w)x._w[k]=(x._w[k]||0)+w[k];}});
  });});
  var out=[];for(var oname in byO){var a=byO[oname];var vs=[];
    for(var vn in a._v){var x=a._v[vn];if(s.wfield){x[s.wfield]=x._w;delete x._w;}vs.push(x);}
    if(s.vfix)vs.forEach(s.vfix);
    vs.sort(function(p,q){return (q[s.vsort]||0)-(p[s.vsort]||0);});
    var o={o:oname,vs:vs};s.ofield.forEach(function(f){o[f]=round2(vs.reduce(function(t,v){return t+(v[f]||0);},0));});
    if(s.ototalFromV)o.total=vs.reduce(function(t,v){return t+(v.pol||0);},0);
    if(s.wfield){var ow={};vs.forEach(function(v){var w=v[s.wfield]||{};for(var k in w)ow[k]=(ow[k]||0)+w[k];});o[s.wfield]=ow;}
    out.push(o);}
  out.sort(function(p,q){return (q[s.osort]||0)-(p[s.osort]||0);});return out;
}

/* oficinas que existen en el año (cualquier mes) para el supervisor filtrado */
function expectedOffices(){
  if(sch().period!=='month')return null;
  var cells=D().cells,want={},sup=state.sup===ALL?null:state.sup,pre=state.year+'|';
  for(var key in cells){if(key.indexOf(pre)!==0)continue;var p=key.split('|');if(sup&&p[2]!==sup)continue;
    cells[key].forEach(function(o){want[o.o]=1;});}
  // unir catálogo de oficinas si estamos en esa zona (o viendo Todos)
  var dir=(curDir&&curDir[state.sponsor])||[];
  if(dir.length){var inter=false;for(var i=0;i<dir.length;i++){if(want[dir[i]]){inter=true;break;}}
    if(inter||state.sup===ALL){for(var j=0;j<dir.length;j++)want[dir[j]]=1;}}
  return want;
}

function parseCSV(t){var rows=[],i=0,field='',row=[],q=false;
  for(;i<t.length;i++){var c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){field+='"';i++;}else q=false;}else field+=c;}
    else{if(c==='"')q=true;else if(c===','){row.push(field);field='';}else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}else if(c==='\r'){}else field+=c;}}
  if(field.length||row.length){row.push(field);rows.push(row);}return rows;}

function doImport(file){
  var rate=parseFloat($('f-tc').value)||510;
  var name=file.name.toLowerCase();
  overlay('Leyendo '+file.name+'…');
  setTimeout(function(){
    if(name.endsWith('.csv')){
      var rd=new FileReader();
      rd.onload=function(){try{overlay('Procesando datos…');setTimeout(function(){
        var rows=parseCSV(rd.result);salesRows=rows;var d=RankProcessor.process(rows,rate,curDir);hideOverlay();applyData(d,true);toast('Datos importados: '+(d.generated)+' · '+SPLIST.length+' sponsors.');},30);
      }catch(e){hideOverlay();toast('Error al procesar: '+e.message);}};
      rd.onerror=function(){hideOverlay();toast('No se pudo leer el archivo.');};
      rd.readAsText(file);
    } else if(name.endsWith('.xlsx')||name.endsWith('.xls')){
      if(file.size>45*1024*1024){ if(!confirm('El archivo pesa '+Math.round(file.size/1048576)+'MB. Procesar Excel grande en el navegador puede tardar mucho o fallar. Para el archivo maestro se recomienda exportar la hoja "Ventas 2025-2026" como CSV. ¿Continuar igual?')){hideOverlay();return;} }
      loadXLSX(function(){
        var rd=new FileReader();

          var wb=XLSX.read(new Uint8Array(rd.result),{type:'array',dense:true});
          var sh=wb.SheetNames.indexOf('Ventas 2025-2026')>=0?'Ventas 2025-2026':wb.SheetNames[0];
          var rows=XLSX.utils.sheet_to_json(wb.Sheets[sh],{header:1,raw:false});salesRows=rows;
          var d=RankProcessor.process(rows,rate,curDir);hideOverlay();applyData(d,true);toast('Datos importados desde Excel: '+d.generated);},30);
        }catch(e){hideOverlay();toast('Error al procesar Excel: '+e.message);}};
        rd.readAsArrayBuffer(file);
      });
    } else {hideOverlay();toast('Formato no soportado. Usa CSV o Excel.');}
  },30);
}

    else{loadXLSX(function(){var rd=new FileReader();rd.onload=function(){try{var wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});var aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false});finish(aoa);}catch(e){hideOverlay();toast('Error leyendo Excel: '+e.message);}};rd.readAsArrayBuffer(file);});}
  },30);

function loadH2C(cb){if(_h2cLoaded&&window.html2canvas){cb();return;}
  var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
  s.onload=function(){_h2cLoaded=true;cb();};s.onerror=function(){toast('No se pudo cargar el generador de imágenes.');};document.head.appendChild(s);}
window.downloadOffice=function(ev,btn){
  ev.preventDefault();ev.stopPropagation();
  var el=btn.closest('details')||btn.closest('.solo');if(!el)return;
  if(el.tagName==='DETAILS')el.open=true;
  toast('Generando imagen…');
  loadH2C(function(){
    setTimeout(function(){
      var cs=getComputedStyle(body);
      var bg=(cs.getPropertyValue('--surface-2')||'#f4f6fb').trim()||'#f4f6fb';
      var fg=(cs.getPropertyValue('--fg')||'#172031').trim();
      var muted=(cs.getPropertyValue('--muted')||'#5c6779').trim();
      var accent=(cs.getPropertyValue('--accent')||'#c0392b').trim();
      var border=(cs.getPropertyValue('--border')||'#e0e6ef').trim();
      var w=Math.max(el.offsetWidth,640);
      var corte=cutShort();
      // Contenedor fuera de pantalla con encabezado + copia de la tarjeta
      var wrap=document.createElement('div');
      wrap.setAttribute('data-sponsor', body.dataset.sponsor||'');
      wrap.style.cssText='position:fixed;left:-99999px;top:0;z-index:-1;box-sizing:border-box;'
        +'width:'+(w+48)+'px;padding:24px;background:'+bg+';font-family:'+cs.fontFamily+';';
      var head=document.createElement('div');
      head.style.cssText='margin:0 0 16px;padding:0 2px 14px;border-bottom:2px solid '+accent+';';
      head.innerHTML='<div style="font-size:19px;font-weight:800;color:'+fg+';letter-spacing:-.01em;">Ranking de Colocación · '+esc(SPNAME[state.sponsor])+'</div>'
        +'<div style="font-size:13px;font-weight:600;color:'+muted+';margin-top:3px;">'+esc(cap(state.month)||'')+' '+esc(state.year||'')+(state.sup!==ALL?(' · Supervisor: '+esc(state.sup)):'')+'</div>'
        +(corte?('<div style="display:inline-block;margin-top:8px;font-size:13px;font-weight:700;color:'+accent+';background:'+bg+';border:1px solid '+border+';border-radius:999px;padding:4px 12px;">📅 Corte al '+esc(corte)+'</div>'):'');
      var clone=el.cloneNode(true);
      if(clone.tagName==='DETAILS')clone.open=true;
      var ib=clone.querySelectorAll('.imgbtn');for(var i=0;i<ib.length;i++)ib[i].remove();
      clone.style.border='1px solid '+border;clone.style.borderRadius='12px';clone.style.background=(cs.getPropertyValue('--surface')||'#fff').trim();
      wrap.appendChild(head);wrap.appendChild(clone);document.body.appendChild(wrap);
      var scale=Math.max(3,(window.devicePixelRatio||1)*2);
      function done(){try{document.body.removeChild(wrap);}catch(e){}}
      try{
        html2canvas(wrap,{backgroundColor:bg,scale:scale,useCORS:true,logging:false})
        .then(function(canvas){
          var off=(el.getAttribute('data-off')||'ranking').replace(/[^\w\-]+/g,'_');
          var a=document.createElement('a');a.download=off+'_'+state.year+(state.month?'_'+state.month:'')+'.png';
          a.href=canvas.toDataURL('image/png');document.body.appendChild(a);a.click();a.remove();
          done();toast('Imagen descargada (PNG alta calidad).');
        }).catch(function(e){done();toast('No se pudo generar la imagen: '+((e&&e.message)||e));});
      }catch(e){done();toast('No se pudo generar la imagen: '+((e&&e.message)||e));}
    },140);
  });
};

/* ---------- init ---------- */
(function init(){
  var stale=false;
  try{var raw=localStorage.getItem(LSKEY);if(raw){var d=JSON.parse(raw);
    if(d&&d.bncr){ if(d.schema===SCHEMA){DATA=d;} else {stale=true;localStorage.removeItem(LSKEY);} }}}catch(e){}
  curDir=(DATA&&DATA.directory)||{};
  try{var rd2=localStorage.getItem(LSDIR);if(rd2){var pd=JSON.parse(rd2);if(pd&&typeof pd==='object'&&Object.keys(pd).length)curDir=pd;}}catch(e){}
  // normalizar catálogo (alias + de-dup) por si quedó uno viejo guardado, y regrabarlo limpio
  try{ if(window.RankProcessor&&RankProcessor.aliasDirectory){ var before=JSON.stringify(curDir); curDir=RankProcessor.aliasDirectory(curDir);
    if(JSON.stringify(curDir)!==before){try{localStorage.setItem(LSDIR,JSON.stringify(curDir));}catch(e){}} } }catch(e){}
  DATA.directory=curDir;
  try{var rp=localStorage.getItem(LSPREF);if(rp){var pp=JSON.parse(rp);if(pp&&typeof pp==='object')prefs=pp;}}catch(e){}
  updateStamp();
  var start=(prefs._last&&SCHEMAS[prefs._last])?prefs._last:'bncr';
  selectSponsor(start);
  if(stale)setTimeout(function(){toast('Los datos guardados eran de una versión anterior. Volvé a importar tu CSV para actualizar.');},300);
})();

</script>
